[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwriter"
version = "1.0.0"
description = "Автопостинг в Threads с очередью постов и ИИ-автором, управление через Telegram"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "httpx>=0.27,<1",
    "apscheduler>=3.10,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-dotenv>=1.0,<2",
    "tzdata>=2024.1",
]

[tool.setuptools]
packages = ["app", "app.agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
